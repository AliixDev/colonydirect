spring:
  application:
    name: colonydirect-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/colonydirect}
    username: ${DB_USER:colonydirect}
    password: ${DB_PASSWORD:colonydirect}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.colonydirect: INFO
