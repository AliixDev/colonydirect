version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: colonydirect
      POSTGRES_USER: colonydirect
      POSTGRES_PASSWORD: colonydirect
    ports:
      - "5432:5432"
    volumes:
      - colonydirect_pgdata:/var/lib/postgresql/data
volumes:
  colonydirect_pgdata:
